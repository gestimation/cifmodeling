template:
  bootstrap: 5

destination: docs

url: https://gestimation.github.io/cifmodeling/

development:
  mode: auto

# Preserve URLs from the historical checked-in site on clean CI builds.
redirects:
  - ["articles/overview.html", "articles/v1_overview.html"]
  - ["articles/polyreg.html", "articles/v2_polyreg.html"]
  - ["articles/formula.html", "articles/v4_formulas.html"]
  - ["articles/formulas.html", "articles/v4_formulas.html"]
  - ["articles/examples.html", "articles/v5_examples.html"]
  - ["articles/gallery.html", "articles/v6_gallery.html"]
  - ["articles/information.html", "articles/v8_information.html"]
  - ["articles/arguments.html", "articles/v9_arguments.html"]
  - ["articles/functions.html", "articles/v1_overview.html"]
  - ["articles/v3_formulas.html", "articles/v4_formulas.html"]
  - ["articles/v4_examples.html", "articles/v5_examples.html"]
  - ["articles/v5_gallery.html", "articles/v6_gallery.html"]
  - ["articles/v5_reporting_results.html", "articles/v7_reporting_results.html"]
  - ["articles/v6_information.html", "articles/v8_information.html"]
  - ["articles/v7_arguments.html", "articles/v9_arguments.html"]
  - ["articles/v8_reporting_cif.html", "articles/v7_reporting_results.html#reporting-cumulative-incidence"]
  - ["articles/v9_reporting_polyreg.html", "articles/v7_reporting_results.html#reporting-cif-regression"]
  - ["articles/v10_cifreport.html", "articles/v7_reporting_results.html#automated-reports"]

home:
  title: cifmodeling
  description: A compact toolkit for Kaplan-Meier/Aalen-Johansen curves, curve-comparison tests, visualization, and direct polytomous regression for survival and competing risks data.

navbar:
  structure:
    left:  [reference, articles, news]
    right: [search, github]
  components:
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
        - text: Overview
          href: articles/v1_overview.html
        - text: Direct polytomous regression
          href: articles/v2_polyreg.html
        - text: Tests of cumulative incidence functions
          href: articles/v3_gray_extensions.html
        - text: Computational formulas in cifcurve()
          href: articles/v4_formulas.html
        - text: Worked examples
          href: articles/v5_examples.html
        - text: Gallery
          href: articles/v6_gallery.html
        - text: Reporting results
          href: articles/v7_reporting_results.html
        - text: Data conventions and implementation details
          href: articles/v8_information.html
        - text: Function reference
          href: articles/v9_arguments.html
    github:
      icon: fa-github
      aria-label: GitHub repository
      href: https://github.com/gestimation/cifmodeling

